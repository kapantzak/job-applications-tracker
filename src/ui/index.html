<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Applications Tracker</title>
    <script>
      // Apply the saved theme before first paint so dark mode does not flash light; mirrors src/ui/theme.ts.
      (function () {
        var theme = 'system';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored;
        } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
